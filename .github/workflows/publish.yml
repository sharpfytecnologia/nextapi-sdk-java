# Publica no Maven Central quando uma tag vX.Y.Z é criada neste repositório (pelo sdks/mirror.sh do monorepo).
# O Central não tem trusted publishing: usa o user token (MAVEN_CENTRAL_*) e a chave de assinatura (GPG_*).
name: publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: A tag tem de ser a versão do pom.xml e do cliente
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$v" = "$GITHUB_REF_NAME"
          grep -q "VERSION = \"$v\"" src/main/java/br/com/sharpfy/nextapi/NextApiClient.java
      - name: Testa, assina e publica
        run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
